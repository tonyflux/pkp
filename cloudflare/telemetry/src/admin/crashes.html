<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>PKP Crash Reports</title>
<style nonce="{{nonce}}">
  :root {
    color-scheme: light dark;
    --bg: #f4f7fb;
    --card: rgba(255, 255, 255, 0.85);
    --text: #18202b;
    --dim: #667085;
    --line: #dce3ed;
    --accent: #1476e8;
    --accent-soft: rgba(20, 118, 232, 0.12);
    --danger: #b42318;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d121a;
      --card: rgba(24, 31, 43, 0.9);
      --text: #ecf2fa;
      --dim: #99a6b8;
      --line: #303b4c;
      --accent: #66adff;
      --accent-soft: rgba(74, 151, 239, 0.15);
      --danger: #ff9d94;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  main { width: min(1120px, calc(100% - 32px)); margin: 28px auto 48px; }
  a { color: var(--accent); }
  h1 { margin: 14px 0 8px; font-size: 24px; letter-spacing: -0.02em; }
  h2 { margin: 0; font-size: 16px; }
  p { line-height: 1.6; }
  .description, #report-id { color: var(--dim); font-size: 13px; }
  .card { min-width: 0; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; gap: 12px; }
  button { min-height: 44px; color: inherit; font: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, textarea:focus-visible, #reports:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: default; }
  #error { color: var(--danger); white-space: pre-wrap; overflow-wrap: anywhere; }
  #error:empty { display: none; }
  #reports { max-height: 32rem; margin: 14px 0; padding: 0; overflow-y: auto; list-style: none; color: var(--text); font-size: 14px; }
  #reports li + li { margin-top: 8px; }
  #reports button {
    display: block; width: 100%; min-width: 0; padding: 10px 12px; text-align: left;
    white-space: normal; overflow-wrap: anywhere; line-height: 1.5;
    border: 1px solid var(--line); border-radius: 9px; background: transparent;
  }
  #reports button:hover, #reports button[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .pagination { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .pagination button, #delete { padding: 8px 14px; border: 1px solid var(--line); border-radius: 9px; background: transparent; }
  #page { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  #report-id { overflow-wrap: anywhere; }
  textarea { display: block; width: 100%; max-width: 100%; min-height: 240px; height: 24rem; padding: 12px; resize: vertical; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; font: 13px/1.5 ui-monospace, monospace; }
  #delete { margin-top: 12px; color: var(--danger); }
  @media (max-width: 720px) {
    main { margin: 20px auto 32px; }
    .layout { grid-template-columns: minmax(0, 1fr); }
    .card { padding: 14px; }
    #reports { max-height: min(18rem, 40vh); overscroll-behavior: contain; }
    textarea { height: 50vh; min-height: 200px; }
  }
  @media (min-width: 721px) {
    .layout:has(#detail[hidden]) { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<main>
  <a href="/">Usage statistics</a><h1>Crash reports</h1>
  <p class="description">Reports can contain sensitive information. They are automatically removed within 30 days when the scheduled cleanup runs.</p>
  <p id="error" role="alert"></p>
  <div class="layout">
    <section class="card" aria-labelledby="reports-heading">
      <h2 id="reports-heading">Reports</h2>
      <ul id="reports" tabindex="0" aria-label="Crash reports"></ul>
      <nav class="pagination" aria-label="Report pages"><button id="previous" type="button">Previous</button><span id="page" aria-live="polite"></span><button id="next" type="button">Next</button></nav>
    </section>
    <section id="detail" class="card" hidden><h2>Report</h2><p id="report-id"></p><textarea id="text" readonly aria-label="Crash report"></textarea><button id="delete" type="button">Delete report</button></section>
  </div>
</main>
<script nonce="{{nonce}}">
const $ = id => document.getElementById(id);
let page = 0, selected = null;
async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) throw new Error(`Request failed (${response.status}). Please retry.`);
  return response.status === 204 ? null : response.json();
}
async function load() {
  try {
    $('error').textContent = '';
    const data = await api(`/api/crashes?page=${page}`);
    $('reports').replaceChildren();
    for (const report of data.reports) {
      const li = document.createElement('li'), button = document.createElement('button');
      button.type = 'button'; button.textContent = `${new Date(report.received_at * 1000).toLocaleString()} — ${report.id}`;
      if (report.id === selected) button.setAttribute('aria-current', 'true');
      button.addEventListener('click', () => show(report.id, button)); li.append(button); $('reports').append(li);
    }
    if (!data.reports.length) $('reports').textContent = 'No reports on this page.';
    $('page').textContent = `Page ${page + 1}`; $('previous').disabled = page === 0; $('next').disabled = !data.more;
  } catch (error) { $('error').textContent = error.message; }
}
async function show(id, current) {
  try {
    $('error').textContent = ''; const report = await api(`/api/crashes/${id}`);
    selected = report.id; $('report-id').textContent = report.id; $('text').value = report.report; $('detail').hidden = false;
    for (const button of $('reports').querySelectorAll('button')) button.removeAttribute('aria-current');
    if (current?.isConnected) current.setAttribute('aria-current', 'true');
    if (matchMedia('(max-width: 720px)').matches) $('detail').scrollIntoView({ block: 'start' });
  } catch (error) { $('error').textContent = error.message; }
}
$('previous').addEventListener('click', () => { if (page) { page--; load(); } });
$('next').addEventListener('click', () => { page++; load(); });
$('delete').addEventListener('click', async () => {
  if (!selected || !confirm('Permanently delete this crash report?')) return;
  try {
    await api(`/api/crashes/${selected}`, { method: 'DELETE' });
    selected = null; $('text').value = ''; $('detail').hidden = true; await load();
  } catch (error) { $('error').textContent = error.message; }
});
load();
</script>
</body>
</html>
