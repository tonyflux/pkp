name: Bug report
description: Report a reproducible problem in PKP
body:
  - type: markdown
    attributes:
      value: |
        This report is public. Do not include passwords, tokens, API keys, share codes, full account identifiers, private filenames, or private paths. Redact logs and screenshots item by item; do not upload your entire configuration directory.
  - type: input
    id: version
    attributes:
      label: PKP version
      description: Enter the exact version. For an unpublished test build, identify its source without including a private download URL.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: For example, macOS version and Apple silicon or Intel
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and reproduction steps
      description: Describe the steps, expected result, and actual result. Include only minimal, redacted error details when needed.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-content check
      options:
        - label: I removed credentials, private files, and account information, and checked logs and screenshots for sensitive content.
          required: true
