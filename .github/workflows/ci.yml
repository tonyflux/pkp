name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  x11-frame-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Restore diagnostic toolchain
        id: toolchain
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/pkp-x11-builder.tar
          key: pkp-x11-debug-toolchain-${{ hashFiles('build/docker/Dockerfile.linux') }}
      - name: Load or save diagnostic toolchain
        env:
          CACHE_HIT: ${{ steps.toolchain.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ]; then
            docker load -i /tmp/pkp-x11-builder.tar
          else
            docker build -f build/docker/Dockerfile.linux -t pkp-linux-builder .
            docker save -o /tmp/pkp-x11-builder.tar pkp-linux-builder
          fi
      - name: Save diagnostic toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/pkp-x11-builder.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}
      - name: Compare chroma scaler passes on both display backends
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          docker run --rm --tmpfs /tmp:rw,exec,mode=1777 --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined \
            -v "$PWD:/src:ro" pkp-linux-builder bash -ec '
              useradd -m tester
              runuser -u tester -- env PATH="$PATH" go test -c -tags pkp_surface_test -o /tmp/surface.test ./internal/mpv
              install -d -m 700 -o tester /tmp/xdg-diag
              runuser -u tester -- env XDG_RUNTIME_DIR=/tmp/xdg-diag weston --backend=headless-backend.so --socket=pkp-diag --idle-time=0 --use-pixman > /tmp/weston.log 2>&1 &
              for n in {1..50}; do [ ! -S /tmp/xdg-diag/pkp-diag ] || break; sleep 0.1; done
              [ -S /tmp/xdg-diag/pkp-diag ] || { cat /tmp/weston.log; exit 1; }
              for mode in draw-trace padded compat compat-large; do
                for backend in x11 wayland; do
                  for trial in 1 2 3; do
                    printf "\n=== %s %s trial %s ===\n" "$mode" "$backend" "$trial"
                    shell=(); if [ "$backend" = x11 ]; then shell=(xvfb-run -a); fi
                    runuser -u tester -- env GDK_BACKEND="$backend" WAYLAND_DISPLAY=pkp-diag XDG_RUNTIME_DIR=/tmp/xdg-diag XDG_CACHE_HOME="/tmp/cache-$mode-$backend-$trial" MALLOC_PERTURB_=128 PKP_TEST_CASE="$mode" PKP_TEST_VIDEO_SURFACE=1 LIBGL_ALWAYS_SOFTWARE=1 dbus-run-session -- "${shell[@]}" /tmp/surface.test -test.run "^TestLinuxSurface$" -test.v -test.timeout 35s > /tmp/trial.log 2>&1 || true
                    grep -E "pkp (lut|pixels|decoded):|real upright|--- (PASS|FAIL): TestLinuxSurface|panic:|^PASS$|^FAIL$" /tmp/trial.log || cat /tmp/trial.log
                  done
                done
              done
            '
