name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  x11-frame-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -f build/docker/Dockerfile.linux -t pkp-linux-builder .
      - name: Trace X11 video frame submission
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          docker run --rm --tmpfs /tmp:rw,exec,mode=1777 --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined \
            -v "$PWD:/src:ro" pkp-linux-builder bash -ec '
              useradd -m tester
              test_x11() {
                runuser -u tester -- env PATH="$PATH" PKP_TEST_SHOW_FIRST="$1" PKP_TEST_VIDEO_SURFACE=1 GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 dbus-run-session -- xvfb-run -a go test -v -tags pkp_surface_test ./internal/mpv -run "^TestLinuxSurface$" -count=1 -timeout 90s
              }
              status=0
              test_x11 0 || status=1
              test_x11 1 || status=1
              exit "$status"
            '
