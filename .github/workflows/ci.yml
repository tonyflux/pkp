name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  x11-frame-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: f977678a23
      - name: Restore diagnostic toolchain
        id: toolchain
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/pkp-x11-builder.tar
          key: pkp-x11-debug-toolchain-${{ hashFiles('build/docker/Dockerfile.linux') }}
      - name: Load or save diagnostic toolchain
        env:
          CACHE_HIT: ${{ steps.toolchain.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ]; then
            docker load -i /tmp/pkp-x11-builder.tar
          else
            docker build -f build/docker/Dockerfile.linux -t pkp-linux-builder .
            docker save -o /tmp/pkp-x11-builder.tar pkp-linux-builder
          fi
      - name: Save diagnostic toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/pkp-x11-builder.tar
          key: ${{ steps.toolchain.outputs.cache-primary-key }}
      - name: Validate the Linux scaler fix on both display backends
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          docker run --rm --tmpfs /tmp:rw,exec,mode=1777 --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined \
            -v "$PWD:/src:ro" pkp-linux-builder bash -ec '
              useradd -m tester
              for trial in {1..10}; do
                printf "\n=== Linux graphics trial %s (X11 then Wayland) ===\n" "$trial"
                runuser -u tester -- env PATH="$PATH" XDG_CACHE_HOME="/tmp/cache-$trial" dbus-run-session -- bash build/linux/smoke.sh
              done
            '
