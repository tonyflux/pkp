version: '3'

tasks:
  build:
    summary: Builds the real GTK4 Linux binary (Ubuntu 24.04+, native architecture)
    cmds:
      - make linux ARCH={{.ARCH | default ARCH}}

  package:
    summary: Builds Linux deb, rpm, AppImage and exact runtime source archive
    cmds:
      - make linux-package ARCH={{.ARCH | default ARCH}}

  build:docker:
    summary: Builds Linux packages in the target-architecture Ubuntu container
    cmds:
      - make linux-docker ARCH={{.ARCH | default ARCH}}

  run:
    cmds:
      - bin/linux-{{.ARCH | default ARCH}}/usr/lib/pkp/pkp
