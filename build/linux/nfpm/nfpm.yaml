name: pkp
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: tonyflux
description: High-performance PikPak desktop client
vendor: PKP
homepage: https://github.com/tonyflux/pkp
license: GPL-3.0-only
contents:
  - src: ${LINUX_STAGE}/usr/lib/pkp/pkp
    expand: true
    dst: /usr/lib/pkp/pkp
    packager: deb
  - src: ./build/linux/pkp
    dst: /usr/bin/pkp
    packager: deb
    file_info:
      mode: 0755
  - src: ${LINUX_APPDIR}
    expand: true
    dst: /opt/pkp/runtime
    type: tree
    packager: rpm
  - src: ./build/linux/pkp-rpm
    dst: /usr/bin/pkp
    packager: rpm
    file_info:
      mode: 0755
  - src: ./build/appicon.png
    dst: /usr/share/icons/hicolor/512x512/apps/pkp.png
  - src: ./build/linux/desktop
    dst: /usr/share/applications/pkp.desktop
  - src: ./LICENSE
    dst: /usr/share/licenses/pkp/LICENSE
  - src: ./frontend/dist/THIRD_PARTY_LICENSES.txt
    dst: /usr/share/licenses/pkp/THIRD_PARTY_LICENSES.txt
  - src: ${LINUX_STAGE}/usr/share/licenses/pkp/GO_LICENSES.txt
    expand: true
    dst: /usr/share/licenses/pkp/GO_LICENSES.txt
  - src: ./build/linux/com.pkp.desktop.policy
    dst: /usr/share/polkit-1/actions/com.pkp.desktop.policy
  - src: ./build/linux/pkp.apparmor
    dst: /etc/apparmor.d/pkp
    type: config
overrides:
  deb:
    depends:
      - libc6 (>= 2.39)
      - libgtk-4-1 (>= 4.14)
      - libwebkitgtk-6.0-4
      - libmpv2 (>= 0.37)
      - libavcodec60
      - libavformat60
      - libavutil58
      - libswresample4
      - ffmpeg (>= 7:6.1)
      - bubblewrap
      - xdg-dbus-proxy
      - xdg-utils
      - polkitd
      - glib-networking
      - gsettings-desktop-schemas
    recommends:
      - gnome-keyring
      - xdg-desktop-portal
  rpm:
    depends:
      - glibc >= 2.39
      - xdg-utils
      - polkit
    recommends:
      - gnome-keyring
      - xdg-desktop-portal
scripts:
  postinstall: ./build/linux/nfpm/scripts/postinstall.sh
  postremove: ./build/linux/nfpm/scripts/postremove.sh
